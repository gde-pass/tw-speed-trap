name: Dataset watch

on:
  schedule:
    # 10:17 on the 3rd, Taiwan time (02:17 UTC) — monthly upstream check
    - cron: "17 2 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dataset-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check upstream datasets
    runs-on: ubuntu-latest
    # Backstop for the per-request wall-clock deadline in fetch.py: a normal
    # run finishes in well under half of this even with several dead hosts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run watch
        # pipefail: a crash inside dataset-watch must fail this step, not
        # vanish behind tee's exit code as a green "nothing new" run.
        run: |
          set -o pipefail
          uv run --project pipeline dataset-watch | tee report.md

      - name: Open or update issue on findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q '^DATASET-WATCH: FINDINGS$' report.md; then
            echo "nothing new upstream"
            exit 0
          fi
          grep -v '^DATASET-WATCH:' report.md > body.md
          gh label create dataset-watch --description "Automated upstream dataset report" --force
          # gh may print the literal string "null" for an empty result;
          # commenting on issue "null" would fail the first findings run.
          existing=$(gh issue list --label dataset-watch --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Upstream dataset changes on data.gov.tw" \
              --body-file body.md --label dataset-watch
          fi
