name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A tag that doesn't match appVersion would ship an APK whose
      # versionCode/versionName lie about the release (v1.1.0 shipped as
      # 1.0.0 once) — installed apps then silently refuse the update.
      - name: Verify tag matches appVersion
        run: |
          app_version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != appVersion $app_version — bump appVersion in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is empty — refusing to build an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # The Gradle build silently produces an unsigned APK when the signing
      # config is absent; never publish without proving the signature.
      - name: Verify APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          expected="52e0e492f49e3662b14a36ba2ad1f236af078c65c70b3514369ca70c10e0da1e"
          if ! grep -qi "SHA-256 digest: $expected" certs.txt; then
            echo "::error::APK is not signed with the release certificate ($expected)"
            exit 1
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "tw-speed-trap-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "tw-speed-trap-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
