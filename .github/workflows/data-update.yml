name: Data update

on:
  schedule:
    # 05:30 Monday Taiwan time (21:30 UTC Sunday)
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# A dispatch overlapping the cron (or two dispatches) must not race the
# push/upload steps against each other.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Rebuild camera database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run pipeline
        # --project (not --directory): keep the repo root as cwd so the
        # output, geojson, assets and fallback-db paths all resolve correctly.
        run: |
          uv run --project pipeline build-db \
            --out pipeline/out \
            --geojson data/cameras.geojson \
            --assets-db app/src/main/assets/cameras.db

      - name: Compare with published data
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_hash=$(jq -r .content_hash pipeline/out/manifest.json)
          old_hash=$(gh release download data --pattern manifest.json --output - 2>/dev/null | jq -r .content_hash || echo "none")
          echo "new=$new_hash old=$old_hash"
          if [ "$new_hash" = "$old_hash" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cameras.geojson app/src/main/assets/cameras.db
          if git diff --cached --quiet; then
            echo "snapshot unchanged, nothing to commit"
          else
            git commit -m "data: update camera database ($(jq -r .data_version pipeline/out/manifest.json), $(jq -r .count pipeline/out/manifest.json) cameras)"
            # The pipeline runs for minutes; main may have moved (this cost a
            # weekly update once). Rebase and retry; -X theirs keeps the
            # freshly regenerated data files on conflict.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt); rebasing onto latest main"
              git pull --rebase -X theirs origin main
              if [ "$attempt" = 3 ]; then
                echo "::error::could not push after 3 rebase attempts"
                exit 1
              fi
            done
          fi

      - name: Publish release assets
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed-tag prerelease `data`: ignored by releases/latest and by
          # Obtainium's default filter, so the app-release channel stays clean.
          gh release view data >/dev/null 2>&1 || \
            gh release create data --prerelease --title "Camera data" \
              --notes "Rolling camera-database release. Assets are replaced in place by the weekly data-update workflow."
          gh release upload data pipeline/out/cameras.db pipeline/out/manifest.json --clobber
