name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        run: ./gradlew assembleDebug :detection:test :app:testDebugUnitTest ktlintCheck detekt --stacktrace

  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run pipeline tests
        run: uv run --directory pipeline pytest
