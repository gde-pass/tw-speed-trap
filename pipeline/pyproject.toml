[project]
name = "twsp-pipeline"
version = "0.1.0"
description = "Builds the TW SpeedTrap camera database from Taiwanese government open data"
requires-python = ">=3.12"
dependencies = [
  "pyproj>=3.7",
  "charset-normalizer>=3.4",
  "requests>=2.32",
]

[project.scripts]
build-db = "twsp_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twsp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
