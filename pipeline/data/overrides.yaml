# Curated row drops — the last resort for a source row whose coordinate is
# wrong but which the automatic checks (districts.py, freeway_check.py) cannot
# catch because the point still lies inside the right township. Every entry
# names the source that holds the same camera at the right place (`keep`), so
# the camera itself stays in the database and only the phantom goes, and cites
# the evidence: reverse geocoding of both copies (nominatim, 2026-10) — the
# dropped copy's nearest road is not the road the description names, the kept
# copy's is. Matching is exact on (source, description); a drop that matches
# no row any more is reported by the build (upstream fixed or renamed it) and
# should then be deleted here.
