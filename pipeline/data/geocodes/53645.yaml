# Curated coordinates for 臺南市固定式交通違規照相設備設置地點 (data.gov.tw 53645).
# The city publishes text locations only (「中華路與中央路口【闖紅燈、超速…】」),
# so parse_53645 joins each row to this table on the exact 設置位置 text and
# reports a row without an entry as "geocode missing" — a new camera upstream
# is never dropped silently, it appears in the build report for curation.
#
# method:
#   osm-junction  shared node of the two named roads in OpenStreetMap (Geofabrik
#                 Taiwan extract of 2026-10-07; provincial 台N refs via the
#                 TW:provincial route relations), the node cluster inside the
#                 row's 行政區 preferred; `note` gives the district the point
#                 fell in and the node count. Border junctions legitimately
#                 land in the neighbouring district.
#   7320-twin     the same camera appears in the national list 7320 (matched on
#                 road names / km markers); its coordinate is reused so the row
#                 dedupes onto the national one and only the type/limit differ.
#   manual        placed by hand, reason in `note`.
#
# Rows deliberately absent: parking-only systems (skipped by the parser) and
# three junctions OSM cannot resolve yet — 北安路4段548巷-近長和街口 (安南),
# 中華北路與觀海橋路口 (北區), 中正路66巷與建國路78巷口 (善化) — which the build
# lists as unresolved until someone pins them on the road.
