# Curated average-speed (區間測速) sections.
#
# Entry/exit pairing is NOT machine-readable in the government datasets, so
# sections are curated here. Every entry below was verified before shipping:
#   pair-given  — both endpoints are government coordinates from paired 7320
#                 rows; the OSM road-walk distance matched the official km
#                 span (checksum quoted per entry).
#   tunnel      — endpoints are the OSM tunnel-bore portals; length is the
#                 walked bore geometry (checksummed against the km span
#                 where the row provides one).
#   linear-ref  — endpoints placed by kilometre along OSM geometry between
#                 two independent government km-coordinate anchors; the
#                 road-length/km-span scale and a witness coordinate from
#                 the zone's own row are the checksums.
# Bearings are the local direction of travel at each endpoint. length_m is
# the distance the running average is computed over and always matches the
# endpoint pair used.
#
# Verify new/changed entries on the map screen and on the road; nudge
# coordinates here and rerun the pipeline to fix.

